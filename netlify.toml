# Netlify yalnızca uygulamanın ihtiyaç duyduğu dosyaları yayınlar. Depodaki eski index_NN.html
# sürümleri, Gpt*.html, CLAUDE.md ve scripts/ klasörü yedek olarak depoda kalır ama sitede açılmaz.
# Uygulamaya yeni bir dosya eklenirse (ikon, resim vb.) aşağıdaki listeye de eklenmeli.
[build]
  command = "rm -rf yayin && mkdir yayin && cp index.html manifest.webmanifest favicon-32.png apple-touch-icon.png icon-192.png icon-512.png yayin/"
  publish = "yayin"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
